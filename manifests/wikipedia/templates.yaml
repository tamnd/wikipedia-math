# The template table of WP3.2.
#
# The key of each entry is the template key: the "Template:" prefix is removed, underscores become spaces, runs of spaces become one space, and the text is lower case. This is TemplateKey of github.com/tamnd/wikipedia-cli/wiki/parse.
#
# Fields of an entry:
#   class:    item, term, anchor, math, crosswalk, citation, hatnote, nav, maintenance, layout, meta or ignore.
#   kind:     for item and term, the kind of the object that the template marks.
#   cue:      strong or normal when the census counts the template as a cue (WP3.4). No cue means that the census does not count it.
#   params:   the role of each parameter: name, text, math, link, title, label, number, id or flag. A number key is a positional parameter.
#   aliases:  other template keys that mean the same template. The redirect table of namespace 10 gives the full set. The aliases here let the extractor work before that table is loaded.
#
# The patterns at the end apply to a key that has no entry.

version: 1

templates:
  # item: marks an item and its kind.
  math theorem:
    class: item
    kind: statement/theorem
    cue: strong
    params: {name: name, math_statement: text, note: text, 1: text, 2: text}
    aliases: [maththeorem, math-theorem, thm]
  math proof:
    class: item
    kind: proof
    cue: strong
    params: {title: title, proof: text, 1: text}
    aliases: [mathproof, math-proof]
  infobox mathematical statement:
    class: item
    kind: statement
    cue: strong
    params: {name: name, type: flag, field: text, statement: text, conjectured by: text, conjecture date: text, first proof by: text, first proof date: text, open problem: flag, known cases: text, implied by: link, equivalent to: link, generalizations: link, consequences: link}
  unsolved:
    class: item
    kind: problem
    cue: strong
    params: {1: flag, 2: text}
    aliases: [unsolved problem]
  numblk:
    class: item
    kind: equation
    cue: normal
    params: {1: text, 2: math, 3: label}
  equation box 1:
    class: item
    kind: equation
    params: {title: title, equation: math}
  infobox book:
    class: meta
  infobox scientist:
    class: meta
  infobox person:
    class: meta
  infobox academic:
    class: meta

  # term: marks a defined term.
  term:
    class: term
    kind: definition
    cue: normal
    params: {1: name, term: name, content: text}
  defn:
    class: term
    kind: definition
    cue: normal
    params: {1: text, defn: text, term: name}
  dfn:
    class: term
    kind: definition
    cue: normal
    params: {1: name}
  dfni:
    class: term
    kind: definition
    cue: normal
    params: {1: name}
  glossary:
    class: layout
  glossary end:
    class: layout
  glossaryforhyperspace:
    class: crosswalk
    params: {1: id, 2: name}

  # anchor: gives an anchor.
  anchor:
    class: anchor
    params: {1: name, 2: name, 3: name}
  vanchor:
    class: anchor
    params: {1: name, 2: name}
    aliases: [visible anchor]

