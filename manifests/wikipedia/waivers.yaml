# The waivers of WP4.8.
#
# A waiver says why a cue has no object. It names a pattern, not a list of articles, so the same pattern in a new article is also waived. Each waiver has these fields:
#
#   id:       a short stable name, such as definition-in-biography.
#   pattern:  what the waiver matches: a template key or a heading role, and optionally the article type.
#   reason:   why the cue has no object, in one sentence.
#   author:   the person who wrote the waiver.
#   date:     the date of the waiver, as YYYY-MM-DD.
#
# Example:
#
#   - id: definition-in-biography
#     pattern: {heading: item/definition, type: biography}
#     reason: A Definition heading in a biography does not define a mathematical item.
#     author: tamnd
#     date: 2026-10-27

version: 1

waivers: []
