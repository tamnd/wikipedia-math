# The texvc macros and their standard TeX (WP3.3).
#
# This file is exported from the tables of github.com/tamnd/wikipedia-cli/wiki/texvc (macros.go). That package follows texutil.json of the MediaWiki Math extension. \le, \ge and \ne are not here, because KaTeX knows them.
#
#   macros:        a texvc macro and the standard TeX that it stands for.
#   text:          a texvc macro that texvc draws in an \mbox, and its character. Outside text it becomes \text{c}.
#   environments:  an environment that KaTeX allows only in display mode, and the form that works anywhere.
#
# Do not edit this file by hand. Change the Go tables and export the file again.

