# The Wikidata classes of signal S5 (WP1.2).
#
# An article has the signal S5 when its Wikidata item is an instance (P31) of a class below, or of a subclass (P279) of it, at any depth. It also has S5 when the item has one of the identifier properties below, or a defining formula (P2534).
#
# The kind is a hint for the article type of WP1.5. The extractor uses it only when the article has no stronger cue. Each id and label was checked against the Wikidata API on 2026-10-27.

