# The heading table of WP3.5.
#
# Each role maps to the normalized texts of its headings. The normalization lowercases the heading, removes the markup, removes the article title, removes a leading "the", and folds plurals. So "Proofs" and "The proof" both match "proof". The plural forms are kept here when people search for them.
#
# A role item/* is an item cue of strength strong (WP3.4). A role section/* is not an item. It tells the extractor how to read the text under it.
#
# A heading under an item heading is a part of that item. A heading that names an item ("Lagrange's theorem") is an item of the kind of its name, with the strength normal. That rule is in the extractor, not in this file.
#
# A heading that this file does not map, and that 5 or more in-scope articles use, is a finding of rule Y09.

version: 1

roles:
  item/definition: [definition, definitions, formal definition, formal definitions, general definition, definition and notation, definition and examples, definition and properties, equivalent definitions, alternative definitions, formulation]
  item/statement: [statement, statement of the theorem, formal statement, theorem, main theorem, precise statement, result, results, existence and uniqueness]
  item/proof: [proof, proofs, proof sketch, sketch of proof, proof of the theorem, elementary proof, proof outline]
  item/example: [example, examples, further examples, examples and counterexamples, simple examples]
  item/counterexample: [counterexample, counterexamples, non-examples]
  item/property: [properties, basic properties, elementary properties, algebraic properties, properties and applications, characterizations, characterization, facts, symmetry, continuity]
  item/generalization: [generalization, generalizations, related results, variants, variations, special cases, special case, converse, extensions, extension]
  item/construction: [construction, constructions, algorithm, algorithms, method, procedure, computation, implementation, enumeration]
  item/conjecture: [conjecture, conjectures, open problems, unsolved problems, open questions]
  item/notation: [notation, terminology, conventions, representations, representation]
  item/application: [applications, application, uses]
  section/history: [history, historical background, background, origin, origins, etymology]
  section/context: [overview, introduction, motivation, intuition, informal description, explanation, description, types, related concepts, topics, limitations, computational complexity]
  section/biography: [biography, life, early life, early life and education, education, education and career, graduate education, career, academic career, life and career, life and work, later life, personal life, family, death, legacy, research, mathematical work, scientific work, contributions, recognition, awards, awards and honors, awards and honours, honours and awards]
  section/works: [selected publications, publications, works, selected works, books, articles, papers, textbooks, literature]
  section/back: [see also, references, notes, footnotes, further reading, external links, bibliography, sources, citations, gallery, images, in popular culture, audience and reception, other]

# patterns apply to a heading that has no entry above.
patterns:
  # A glossary or a list splits its entries by letter: "A", "B", "X–Z".
  - match: '^[a-z0-9]$|^[a-z0-9] ?(-|–|to) ?[a-z0-9]$'
    role: section/index
